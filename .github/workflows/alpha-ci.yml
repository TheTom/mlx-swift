name: alpha CI

# Builds and runs unit tests on the ekryski fork's `alpha` branch and any PR
# targeting it. The submodules (ekryski/mlx and ekryski/mlx-c) come along
# via the recursive checkout.
#
# We use xcodebuild rather than `swift test`. SwiftPM cannot compile .metal
# sources, so a `swift test` run produces a test bundle without a
# default.metallib and every test that touches the GPU fails at runtime
# with "Failed to load the default metallib". xcodebuild integrates the
# MetalToolchain, compiles the .metal files, and bundles the resulting
# default.metallib into the .xctest bundle. This matches what upstream
# mlx-swift's pull_request.yml does on its self-hosted runners.
#
# Tests run in Debug mode (xcodebuild's default for build-for-testing).
# That's required for MLX/WiredMemory.swift's `#if DEBUG`-gated test-only
# API (`WiredMemoryManager.makeForTesting` and the event-emission
# machinery behind `events()`) to be available — `WiredMemoryTests` would
# otherwise fail to compile because those symbols are stripped in release.

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]

permissions:
  contents: read

concurrency:
  group: alpha-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/alpha' }}

jobs:
  build_and_test:
    if: github.repository_owner == 'ekryski'
    name: Build and unit-test (M1 macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -a

      - name: Verify submodule SHAs match gitlinks
        run: |
          # If submodules drifted relative to the tree, fail loudly here
          # rather than producing confusing compile errors deeper in the run.
          git submodule status --recursive
          git submodule foreach --recursive 'git diff --quiet HEAD || (echo "submodule $name has unstaged changes"; exit 1)'

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          # Key on Package.swift + .gitmodules + commit SHA. Submodule pins
          # are gitlinks (tree entries), not regular files, so hashFiles can't
          # see them directly — relying on the SHA + restore-keys ladder gives
          # us partial hits when only Swift sources change.
          key: dd-${{ runner.os }}-${{ hashFiles('Package.swift', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            dd-${{ runner.os }}-${{ hashFiles('Package.swift', '.gitmodules') }}-
            dd-${{ runner.os }}-

      - name: Build for testing (xcodebuild — compiles .metal + bundles metallib)
        run: |
          xcodebuild build-for-testing \
            -scheme mlx-swift-Package \
            -destination 'platform=macOS' \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData/mlx-swift

      - name: Run CmlxTests
        run: |
          xcrun xctest \
            ~/Library/Developer/Xcode/DerivedData/mlx-swift/Build/Products/Debug/CmlxTests.xctest

      - name: Run MLXTests
        run: |
          xcrun xctest \
            ~/Library/Developer/Xcode/DerivedData/mlx-swift/Build/Products/Debug/MLXTests.xctest
